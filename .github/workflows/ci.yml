name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: 核心库 wasm32 编译（契约第 6 节双目标承诺）
        run: cargo check -p wotb-replay-core -p wotb-replay-wasm --target wasm32-unknown-unknown
      - name: 工作区测试（含真实样本探针的单元部分；探针样本不入 CI）
        run: cargo test --workspace

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Vue 构建验证（双通道接入点编译）
        run: npm run build
