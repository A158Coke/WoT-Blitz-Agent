name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: 核心库 wasm32 编译（契约第 6 节双目标承诺）
        run: cargo check -p wotb-replay-core -p wotb-replay-wasm --target wasm32-unknown-unknown
      - name: 工作区测试（含真实样本探针的单元部分；探针样本不入 CI）
        run: cargo test --workspace
      - name: Clippy 门禁（零告警）
        run: cargo clippy --workspace --all-targets -- -D warnings

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: ESLint（场景 JS 门禁——no-undef 拦截"使用未导入标识符"类运行时错误）
        run: npm run lint
      - name: Vue 构建验证（双通道接入点编译）
        run: npm run build

  # bundle 特性（rust-embed 编译期嵌入 + build.rs 前置检查）此前只在 tag 发布时
  # 首次编译——嵌入面/占位页/目录排除等问题只能等发布时刻爆。debug + bundle 即
  # 走 debug-embed 的编译期嵌入路径，无需完整 release 优化。
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: 前端产物（rust-embed 嵌入输入）
        run: npm run build
        working-directory: frontend
      - name: bundle 特性编译验证（data/ + 前端 + wasm 嵌入路径）
        run: cargo build --features bundle
