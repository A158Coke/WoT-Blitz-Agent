name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 发布前测试（坏 tag 不出包）
        run: cargo test --workspace

      - name: 前端依赖
        working-directory: frontend
        run: npm ci

      - name: 解析 wasm-bindgen 版本（随 Cargo.lock）
        shell: pwsh
        id: wbgver
        run: |
          $v = (Select-String -Path Cargo.lock -Pattern 'name = "wasm-bindgen"' -Context 0,1 |
            ForEach-Object { $_.Context.PostContext } | Select-String 'version').ToString() -replace '.*"(.*)".*', '$1'
          "version=$v" >> $env:GITHUB_OUTPUT

      # cargo install 每次约 5-10 分钟——按版本缓存二进制，命中即跳过安装
      - name: wasm-bindgen-cli 二进制缓存
        id: wbg-bin
        uses: actions/cache@v4
        with:
          path: ~\.cargo\bin\wasm-bindgen.exe
          key: wasm-bindgen-cli-${{ steps.wbgver.outputs.version }}-windows

      - name: 安装 wasm-bindgen-cli（未命中缓存时）
        if: steps.wbg-bin.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version ${{ steps.wbgver.outputs.version }} --locked

      - name: WASM 产物构建
        shell: pwsh
        run: |
          cargo build -p wotb-replay-wasm --release --target wasm32-unknown-unknown
          wasm-bindgen target\wasm32-unknown-unknown\release\wotb_replay_wasm.wasm `
            --out-dir frontend\public\wasm --target web --out-name wotb_replay_wasm
          # 前端构建放最后：dist 拷入 public/wasm 产物，rust-embed 随 exe 嵌入
          npm --prefix frontend run build

      - name: WASM 消费产物打包（供 WotBTools 直接取用，免自建）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release/wasm | Out-Null
          Copy-Item frontend/public/wasm/wotb_replay_wasm.js release/wasm/
          Copy-Item frontend/public/wasm/wotb_replay_wasm_bg.wasm release/wasm/
          $sha = (git rev-parse HEAD).Trim()
          @{ upstream_commit = $sha
             tag = '${{ github.ref_name }}'
             bindgen = (wasm-bindgen --version) } | ConvertTo-Json |
            Set-Content release/wasm/fingerprint.json
          Compress-Archive -Path release/wasm/* `
            -DestinationPath "wotb-replay-wasm-${{ github.ref_name }}.zip" -Force

      - name: 资产清单（含 sha256；GLB/地图包入库备查）
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          python scripts/asset_manifest.py --json release/asset_manifest.json --hashes

      - name: 自包含可执行（bundle：data/ + 前端 + wasm 全嵌入）
        shell: pwsh
        run: cargo build --release --features bundle

      - name: 打包
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item target/release/wotb-agent.exe release/
          Copy-Item config.toml.example release/
          Copy-Item README.md release/
          Compress-Archive -Path release/* -DestinationPath "wotb-agent-${{ github.ref_name }}-win64.zip" -Force

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          files: |
            wotb-agent-*-win64.zip
            wotb-replay-wasm-*.zip
            release/asset_manifest.json
