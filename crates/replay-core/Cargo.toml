[package]
name = "wotb-replay-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
wotbreplay-parser = { version = "0.4", features = ["meta", "raw-payload"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
