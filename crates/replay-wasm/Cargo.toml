[package]
name = "wotb-replay-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
# cdylib = wasm 产物；rlib = 原生环境跑同一套纯逻辑测试
crate-type = ["cdylib", "rlib"]

[dependencies]
wotb-replay-core = { path = "../replay-core" }
wotbreplay-parser = { version = "0.4", features = ["meta", "raw-payload"] }
serde_json = "1"
anyhow = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
