[package]
name = "wotb-replay-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
# cdylib = wasm 产物；rlib = 原生环境跑同一套纯逻辑测试
crate-type = ["cdylib", "rlib"]

[dependencies]
wotb-replay-core = { path = "../replay-core" }
wotbreplay-parser.workspace = true
serde_json.workspace = true
anyhow.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
